# Rhino Package Manager (Yak) manifest; tools/make_yak.py fills in the version from the .csproj
name: geobim
version: 0.0.0
authors:
- Christof Lorenz
description: >
  Beta. Puts Rhino models in their place on the map: uploads them to geoBIM.app (IFC 4 or GLB, converted to
  3D Tiles, opened in the browser in place) or to your own Cesium ion account, and exports IFC 4 and GLB.
  GeoBIMLocation georeferences a model in one step: a point of the model and its position as map coordinates
  (LV95, UTM, Gauss-Krüger, …), latitude/longitude, a place or address, or a click on a map. Uploads to
  geoBIM.app need an account (ask at info@geobim.app); export, georeferencing and Cesium ion work without it.
url: https://geobim.app
icon: icon.png
keywords:
